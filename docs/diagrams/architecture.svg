<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#0d1117"/>
  <text x="30" y="42" fill="#e6edf3" font-size="22" font-weight="600">Self-Healing Web App — Azure</text>
  <text x="30" y="66" fill="#8b949e" font-size="13">detect → decide → remediate → verify → audit</text>

  <!-- Internet -->
  <circle cx="60" cy="180" r="26" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="60" y="185" fill="#c9d1d9" font-size="11" text-anchor="middle">users</text>

  <!-- App Gateway -->
  <rect x="130" y="130" width="200" height="100" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="230" y="158" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">Application Gateway</text>
  <text x="230" y="176" fill="#8b949e" font-size="11" text-anchor="middle">WAF_v2 · zones 1-3</text>
  <text x="230" y="196" fill="#c9d1d9" font-size="11" text-anchor="middle">probe /health 15s</text>
  <text x="230" y="214" fill="#c9d1d9" font-size="11" text-anchor="middle">unhealthy ×3 → out of pool</text>
  <line x1="88" y1="180" x2="126" y2="180" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VMSS -->
  <rect x="400" y="100" width="300" height="170" rx="8" fill="none" stroke="#30363d" stroke-dasharray="4 3"/>
  <text x="415" y="122" fill="#8b949e" font-size="11" font-weight="600">VM SCALE SET · autoscale 2–12</text>
  <rect x="418" y="136" width="80" height="50" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
  <text x="458" y="156" fill="#3fb950" font-size="10" text-anchor="middle">zone 1</text>
  <text x="458" y="172" fill="#c9d1d9" font-size="10" text-anchor="middle">nginx + app</text>
  <rect x="510" y="136" width="80" height="50" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
  <text x="550" y="156" fill="#3fb950" font-size="10" text-anchor="middle">zone 2</text>
  <text x="550" y="172" fill="#c9d1d9" font-size="10" text-anchor="middle">nginx + app</text>
  <rect x="602" y="136" width="80" height="50" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="642" y="156" fill="#f85149" font-size="10" text-anchor="middle">zone 3</text>
  <text x="642" y="172" fill="#f85149" font-size="10" text-anchor="middle">✗ broken</text>
  <text x="415" y="212" fill="#6e7681" font-size="10">Azure Monitor Agent + DCR → guest metrics, syslog</text>
  <text x="415" y="232" fill="#6e7681" font-size="10">boot diagnostics · premium SSD · AAD SSH</text>
  <text x="415" y="252" fill="#6e7681" font-size="10">health probe ≥50% healthy → traffic served</text>
  <line x1="330" y1="180" x2="396" y2="180" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Log Analytics -->
  <rect x="760" y="110" width="300" height="150" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="910" y="138" fill="#a371f7" font-size="13" font-weight="600" text-anchor="middle">Log Analytics Workspace</text>
  <text x="780" y="162" fill="#c9d1d9" font-size="11">heartbeat · perf counters · syslog</text>
  <text x="780" y="182" fill="#c9d1d9" font-size="11">AppGatewayAccessLog · FirewallLog</text>
  <text x="780" y="202" fill="#c9d1d9" font-size="11">HealingAudit_CL ← runbook writes</text>
  <text x="780" y="228" fill="#6e7681" font-size="10">retention 30d dev / 90d prod</text>
  <text x="780" y="246" fill="#6e7681" font-size="10">shared scope for workbook + alerts</text>
  <line x1="700" y1="175" x2="756" y2="175" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Alert rules -->
  <rect x="760" y="300" width="300" height="140" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="910" y="326" fill="#d29922" font-size="13" font-weight="600" text-anchor="middle">Alert Rules</text>
  <text x="780" y="350" fill="#c9d1d9" font-size="11">SEV1 instance unavailable (metric)</text>
  <text x="780" y="370" fill="#c9d1d9" font-size="11">SEV2 heartbeat missing (KQL)</text>
  <text x="780" y="390" fill="#c9d1d9" font-size="11">SEV2 5xx sustained (KQL)</text>
  <text x="780" y="410" fill="#f85149" font-size="11">SEV1 healing failure (watchdog)</text>
  <text x="780" y="430" fill="#6e7681" font-size="10">instance dimension → precise blast radius</text>
  <line x1="910" y1="260" x2="910" y2="296" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action groups -->
  <rect x="470" y="330" width="230" height="80" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="585" y="356" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">Action Groups</text>
  <text x="585" y="376" fill="#c9d1d9" font-size="11" text-anchor="middle">heal → runbook</text>
  <text x="585" y="394" fill="#c9d1d9" font-size="11" text-anchor="middle">notify → email / Teams</text>
  <line x1="756" y1="360" x2="704" y2="360" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Automation -->
  <rect x="130" y="470" width="290" height="150" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="275" y="496" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">Automation Account</text>
  <text x="150" y="520" fill="#c9d1d9" font-size="11">Heal-ReimageInstance (PS 7.2)</text>
  <text x="150" y="540" fill="#c9d1d9" font-size="11">Heal-RestartVmss (PS 7.2)</text>
  <text x="150" y="562" fill="#6e7681" font-size="10">lock tag · verify before · verify after</text>
  <text x="150" y="580" fill="#6e7681" font-size="10">Managed identity: VM Contributor</text>
  <text x="150" y="596" fill="#6e7681" font-size="10">scoped to VMSS resource only</text>
  <text x="150" y="612" fill="#6e7681" font-size="10">no rights to network / monitoring</text>
  <line x1="500" y1="414" x2="400" y2="468" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Healing action onto broken instance -->
  <path d="M 290 470 C 290 380 640 330 642 192" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <text x="420" y="330" fill="#3fb950" font-size="11" font-weight="600">reimage → healthy in ~90s</text>

  <!-- Audit write -->
  <path d="M 275 470 C 500 470 660 400 770 250" fill="none" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="470" y="452" fill="#a371f7" font-size="11" font-weight="600">audit row → HealingAudit_CL</text>

  <!-- Legend -->
  <rect x="460" y="480" width="640" height="140" rx="8" fill="#0b1020" stroke="#30363d"/>
  <text x="480" y="506" fill="#e6edf3" font-size="12" font-weight="600">Healing timeline (measured)</text>
  <line x1="480" y1="540" x2="1080" y2="540" stroke="#30363d"/>
  <g fill="#8b949e" font-size="10">
    <text x="480" y="528" text-anchor="middle">t+0s</text>
    <text x="600" y="528" text-anchor="middle">t+30s</text>
    <text x="740" y="528" text-anchor="middle">t+60s</text>
    <text x="880" y="528" text-anchor="middle">t+90s</text>
    <text x="1060" y="528" text-anchor="middle">t+155s</text>
  </g>
  <g fill="#c9d1d9" font-size="10">
    <text x="480" y="560" text-anchor="middle">instance dies</text>
    <text x="600" y="560" text-anchor="middle">out of backend pool</text>
    <text x="740" y="560" text-anchor="middle">alert → runbook</text>
    <text x="880" y="560" text-anchor="middle">reimage starts</text>
    <text x="1060" y="560" text-anchor="middle">audit written</text>
  </g>
  <text x="480" y="592" fill="#3fb950" font-size="11">Users see zero errors from t+30s onward. The reimage is housekeeping, not the fix.</text>
</svg>
