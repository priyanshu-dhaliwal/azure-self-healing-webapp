#cloud-config
# Installs nginx + the demo app on every VMSS instance at boot.
# The app exposes:
#   GET /health  -> 200 "ok"   (this is what the App Gateway probe matches)
#   GET /        -> HTML status page with instance id
#   GET /chaos/* -> intentional failure hooks (disabled unless CHAOS_ENABLED=true)

package_update: true
packages:
  - nginx
  - curl

write_files:
  - path: /opt/app/server.py
    permissions: '0755'
    content: |
      import http.server, socketserver, os, socket, time, sys, threading

      CHAOS_ENABLED = os.environ.get("CHAOS_ENABLED", "true").lower() == "true"
      STATE = {"broken": False, "hang_until": 0}
      INSTANCE = socket.gethostname()
      START = time.time()

      class Handler(http.server.BaseHTTPRequestHandler):
          def log_message(self, *a):  # quiet by default; errors go to nginx log
              pass

          def _send(self, code, body, ctype="text/plain"):
              payload = body.encode()
              self.send_response(code)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(len(payload)))
              self.end_headers()
              self.wfile.write(payload)

          def do_GET(self):
              # chaos: hang the request thread (simulates a wedged app)
              if STATE["hang_until"] > time.time():
                  time.sleep(30)
              if self.path == "/health":
                  if STATE["broken"]:
                      return self._send(500, "broken")
                  return self._send(200, "ok")
              if self.path == "/chaos/break":
                  if not CHAOS_ENABLED: return self._send(403, "chaos disabled")
                  STATE["broken"] = True
                  return self._send(200, "broken=true")
              if self.path == "/chaos/fix":
                  STATE["broken"] = False
                  return self._send(200, "broken=false")
              if self.path == "/chaos/hang":
                  if not CHAOS_ENABLED: return self._send(403, "chaos disabled")
                  STATE["hang_until"] = time.time() + 120
                  return self._send(200, "hanging for 120s")
              if self.path == "/":
                  uptime = int(time.time() - START)
                  html = f"""<html><head><title>Self-Healing Demo</title>
                  <style>body{{font-family:system-ui;background:#0b1020;color:#e6edf3;
                  display:flex;align-items:center;justify-content:center;height:100vh}}
                  .c{{text-align:center}}code{{background:#161b22;padding:2px 6px;border-radius:4px}}
                  </style></head><body><div class="c">
                  <h1>Self-Healing Web App</h1>
                  <p>Instance: <code>{INSTANCE}</code></p>
                  <p>Uptime: {uptime}s &nbsp;|&nbsp; State: {'<b style="color:#f85149">BROKEN</b>' if STATE["broken"] else '<b style="color:#3fb950">healthy</b>'}</p>
                  <p><a style="color:#58a6ff" href="/health">/health</a></p>
                  </div></body></html>"""
                  return self._send(200, html, "text/html")
              return self._send(404, "not found")

      class Threaded(socketserver.ThreadingMixIn, http.server.HTTPServer):
          daemon_threads = True

      if __name__ == "__main__":
          Threaded(("127.0.0.1", 8080), Handler).serve_forever()

  - path: /etc/nginx/sites-available/default
    content: |
      server {
          listen 80 default_server;
          server_name _;

          # The health endpoint must never be cached and must be cheap.
          location = /health {
              proxy_pass http://127.0.0.1:8080/health;
              proxy_connect_timeout 2s;
              proxy_read_timeout 5s;
              add_header Cache-Control "no-store";
          }

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_connect_timeout 2s;
              proxy_read_timeout 30s;
          }
      }

  - path: /etc/systemd/system/webapp.service
    content: |
      [Unit]
      Description=Self-healing demo app
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/app/server.py
      Restart=always
      RestartSec=2
      Environment=CHAOS_ENABLED=true

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now webapp.service
  - systemctl restart nginx
  # Install the Azure Monitor agent is handled by the VM extension, not here.
  - echo "self-healing demo node ready: $(hostname)" | logger -t shw-bootstrap
